services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: fulfillment}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 10}
  api:
    build: .
    env_file: .env.example
    environment: {DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/fulfillment"}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
